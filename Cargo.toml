[package]
authors = ["Asa Rentschler <asa.rentschler@proton.me>"]
description = "A pure Rust implementation of BLAS."
name = "rublas"
version = "0.1.0-dev"
edition = "2024"

[lib]
name = "rublas"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "rublas_info"
path = "src/info.rs"

[features]
default = []
c_cpp = []
cblas = []

[dependencies]
cfg-if = "1.0.4"

[lints.clippy]
unused_unit = "allow"
unnecessary_cast = "allow"

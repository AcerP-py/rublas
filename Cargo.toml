[package]
authors = ["Asa Rentschler <asa.rentschler@proton.me>"]
description = "BLAS in pure Rust"
name = "rublas"
version = "0.1.0-alpha.1"
edition = "2024"

[lib]
name = "rublas"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "rublas_info"
path = "src/info.rs"

[features]
default = ["c_cpp", "cblas"]
c_cpp = []
cblas = []

[dependencies]
cfg-if = "1.0.3"

[package]
name = "rublas"
version = "0.1.0-alpha.1"
edition = "2024"

authors = ["Asa Rentschler <asa.rentschler@proton.me>"]
description = "A pure Rust implementation of BLAS."
readme = "README.md"
license = "MIT"
repository = "https://github.com/AcerP-py/rublas"
keywords = ["blas", "hpc"]

[lib]
name = "rublas"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "rublas_info"
path = "src/info.rs"

[features]
default = []
c_cpp = []
cblas = []

[dependencies]
cfg-if = "1.0.4"

[lints.cargo]
non_kebab_case_bins = "allow"

[lints.clippy]
unused_unit = "allow"
unnecessary_cast = "allow"
